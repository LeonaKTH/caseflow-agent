[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "caseflow-agent"
version = "1.0.0"
description = "Reliable simulated customer support with versioned consent, durable receipts and crash recovery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3",
    "langchain-core>=1.6,<2",
    "pydantic>=2.7,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
caseflow = "caseflow.__main__:main"
support-agent = "support_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caseflow = ["web/*.html", "web/*.css", "web/*.js"]


[tool.setuptools.data-files]
"share/caseflow" = ["data/agent_eval_v1.json", "data/business_extra.json", "data/caseflow_tasks.json", "data/policies.md", "data/policies_zh.md", "data/scenarios.json", "data/store.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
